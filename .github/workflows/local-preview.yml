name: BALFEST local VM preview

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only trusted main + manual trigger. Never execute fork PRs on a self-hosted VM.
permissions:
  contents: read

concurrency:
  group: balfest-local-preview
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Install Docker, test and deploy
    runs-on: [self-hosted, linux, x64, balfest-vm]
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Ubuntu runner and unattended sudo
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          if ! sudo -n true; then
            echo "::error::The runner needs passwordless sudo in this dedicated Ubuntu VM to install Docker and deploy containers."
            echo "::error::See docs/LOCAL_RUNNER.md. Do not enable unattended sudo on your everyday computer."
            exit 1
          fi

      - name: Install Docker Engine and Compose when missing
        run: sudo -n bash deploy/install-docker.sh

      - name: Verify Docker daemon, CLI, Compose and test container
        run: |
          set -euo pipefail
          sudo -n docker version
          sudo -n docker compose version
          sudo -n docker info >/dev/null
          sudo -n docker run --rm hello-world

      - name: Validate Compose configuration
        run: sudo -n docker compose --project-name balfest-preview config --quiet

      - name: Build test stage and run all Python unit tests
        run: sudo -n docker build --target test --tag balfest-preview-tests:latest .

      - name: Build and deploy FastAPI plus Nginx
        run: sudo -n docker compose --project-name balfest-preview up --detach --build --remove-orphans --wait --wait-timeout 120

      - name: Validate Nginx configuration inside running container
        run: sudo -n docker compose --project-name balfest-preview exec -T web nginx -t

      - name: Check service health and HTTP responses
        run: bash deploy/check-preview.sh

      - name: Show diagnostic logs on failure
        if: failure()
        run: |
          sudo -n docker compose --project-name balfest-preview ps || true
          sudo -n docker compose --project-name balfest-preview logs --tail=100 || true
