name: balfest-preview
services:
  app:
    build:
      context: .
      target: runtime
    image: balfest-preview-app:local
    restart: unless-stopped
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 8
      start_period: 15s
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
