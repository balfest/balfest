{% if call_visible %}
<section class="section open-call-section" id="participation" aria-labelledby="call-title"{% if deadline %} data-open-call-until="{{ deadline }}T23:59:59+03:00"{% endif %}>
  <div class="container open-call-layout">
    <div class="open-call-copy">
      <p class="eyebrow">04 / Участие в программе · Open Call</p>
      <h2 id="call-title">{{ c.openCall.heading }}<br><em>{{ c.openCall.accent }}</em></h2>
      <p>{{ c.openCall.description }}</p>
      {% if deadline %}<p class="status-badge">До {{ deadline_label }}</p>{% endif %}
      <p class="small-note">{{ c.openCall.prompt }}</p>
      <a class="button button-gold" href="{{ c.openCall.url }}" target="_blank" rel="noopener noreferrer">{{ c.openCall.label }}<span aria-hidden="true">↗</span></a>
    </div>
    <figure class="call-figure">
      <a href="{{ url_for('static', path='assets/open-call-full.webp') }}" target="_blank" rel="noopener noreferrer" aria-label="Открыть афишу Open Call в полном размере">
        <img src="{{ url_for('static', path='assets/' ~ c.openCall.image) }}" srcset="{{ url_for('static', path='assets/open-call-768.webp') }} 768w, {{ url_for('static', path='assets/open-call-1280.webp') }} 1280w, {{ url_for('static', path='assets/open-call-full.webp') }} 1672w" sizes="(max-width: 767px) calc(100vw - 36px), 55vw" width="1672" height="941" alt="{{ c.openCall.imageAlt }}" loading="lazy" decoding="async">
      </a>
      <figcaption><span>Рабочая художественная афиша</span><a class="text-link" href="{{ url_for('static', path='assets/open-call-full.webp') }}" target="_blank" rel="noopener noreferrer">Открыть крупнее <span aria-hidden="true">↗</span></a></figcaption>
    </figure>
  </div>
</section>
{% endif %}
